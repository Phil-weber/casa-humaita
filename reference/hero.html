<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Newsreader'; src: url('assets/fonts/Newsreader.ttf') format('truetype-variations'); font-weight: 200 800; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Newsreader'; src: url('assets/fonts/Newsreader-Italic.ttf') format('truetype-variations'); font-weight: 200 800; font-style: italic; font-display: swap; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #0b1620; color: #fff; -webkit-font-smoothing: antialiased; }
  a { color: #fff; text-decoration: none; }
  a:hover { color: #dfe9ef; }
</style>
</helmet>
<div ref="{{ rootRef }}" style="position: relative; width: 100%; height: 340vh; background: #0b1620">
  <div style="position: sticky; top: 0; height: 100vh; width: 100%; overflow: hidden">
    <img ref="{{ imgRef }}" src="assets/hero-casa-humaita.png" alt="Casa Humaitá vista da baía" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 0%; will-change: object-position">
    <div ref="{{ vignetteRef }}" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6,20,34,0.34) 0%, rgba(6,20,34,0.04) 34%, rgba(6,20,34,0) 62%, rgba(6,20,34,0.42) 100%); pointer-events: none"></div>

    <div style="position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr auto; padding: 40px 48px 40px 48px; box-sizing: border-box">

      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 40px">
        <img src="assets/logo-branca.png" alt="Casa Humaitá" style="width: 132px; height: auto; opacity: 0.95">
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 14px; font-family: Jost, sans-serif">
          <a href="#reservar" style="font-family: Newsreader, serif; font-size: 19px; line-height: 1.15; letter-spacing: 0.01em; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.8); padding-bottom: 3px; width: 115px; font-weight: 400">Reserve<br>sua estadia</a>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 7px; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 400">
            <a href="#comodos" style="font-size: 9px">Veja os cômodos</a>
            <a href="#contato" style="font-size: 9px">Nossos contatos</a>
          </div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center">
        <div ref="{{ titleRef }}" style="will-change: transform, opacity">
          <div style="font-family: Jost, sans-serif; font-size: 12px; letter-spacing: 0.42em; text-transform: uppercase; opacity: 0.85; margin-bottom: 22px">Búzios · Brasil</div>
          <h1 style="font-family: Newsreader, serif; font-weight: 300; font-size: clamp(64px, 11vw, 188px); line-height: 0.9; margin: 0; letter-spacing: -0.015em; text-wrap: balance">Casa Humaitá</h1>
          <div style="font-family: Newsreader, serif; font-style: italic; font-weight: 300; font-size: clamp(20px, 2.4vw, 34px); opacity: 0.92; margin-top: 14px">Sua casa no paraíso de búzios</div>
        </div>
      </div>

      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; font-family: Jost, sans-serif; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase">
        <div style="display: flex; align-items: center; gap: 14px">
          <span ref="{{ counterRef }}" style="font-variant-numeric: tabular-nums; opacity: 0.75">00</span>
          <span style="width: 96px; height: 1px; background: rgba(255,255,255,0.35); position: relative; overflow: hidden"><span ref="{{ barRef }}" style="position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: #fff"></span></span>
          <span ref="{{ hintRef }}" style="opacity: 0.85">Role para descer</span>
        </div>
        <div ref="{{ captionRef }}" style="opacity: 0; text-align: right; max-width: 320px; letter-spacing: 0.16em; line-height: 1.9">quatro suítes sobre a enseada<br><a href="#comodos" style="border-bottom: 1px solid rgba(255, 255, 255, 0.7); padding-bottom: 2px;">Conheça a casa</a></div>
      </div>

    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;scrollDepth&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:340,&quot;min&quot;:180,&quot;max&quot;:700,&quot;step&quot;:20,&quot;unit&quot;:&quot;vh&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Scroll&quot;},&quot;smoothness&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.07,&quot;min&quot;:0.02,&quot;max&quot;:0.3,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Scroll&quot;}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.imgRef = React.createRef();
    this.titleRef = React.createRef();
    this.counterRef = React.createRef();
    this.barRef = React.createRef();
    this.hintRef = React.createRef();
    this.captionRef = React.createRef();
    this.vignetteRef = React.createRef();
    this.rootRef = React.createRef();
    this.target = 0;
    this.current = 0;
  }
  applyProps() {
    if (this.rootRef.current) this.rootRef.current.style.height = (this.props.scrollDepth ?? 340) + 'vh';
  }
  componentDidUpdate() { this.applyProps(); }
  componentDidMount() {
    this.applyProps();
    this.onScroll = () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      this.target = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('resize', this.onScroll);
    this.onScroll();
    const clamp = (v) => Math.min(1, Math.max(0, v));
    const tick = () => {
      const ease = Math.min(0.5, Math.max(0.02, this.props.smoothness ?? 0.07));
      this.current += (this.target - this.current) * ease;
      const p = this.current;
      const img = this.imgRef.current;
      if (img) img.style.objectPosition = 'center ' + (p * 100).toFixed(2) + '%';
      const t = this.titleRef.current;
      if (t) {
        t.style.transform = 'translateY(' + (-p * 90).toFixed(1) + 'px) scale(' + (1 - p * 0.1).toFixed(4) + ')';
        t.style.opacity = (1 - clamp((p - 0.28) / 0.32)).toFixed(3);
      }
      if (this.counterRef.current) this.counterRef.current.textContent = String(Math.round(p * 100)).padStart(2, '0');
      if (this.barRef.current) this.barRef.current.style.width = (p * 100).toFixed(1) + '%';
      if (this.hintRef.current) this.hintRef.current.style.opacity = (0.85 * (1 - clamp(p / 0.2))).toFixed(3);
      if (this.captionRef.current) this.captionRef.current.style.opacity = clamp((p - 0.72) / 0.2).toFixed(3);
      if (this.vignetteRef.current) this.vignetteRef.current.style.opacity = (0.75 + 0.25 * p).toFixed(3);
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('resize', this.onScroll);
  }
  renderVals() {
    return {
      imgRef: this.imgRef,
      titleRef: this.titleRef,
      counterRef: this.counterRef,
      barRef: this.barRef,
      hintRef: this.hintRef,
      captionRef: this.captionRef,
      vignetteRef: this.vignetteRef
    };
  }
}

</script>
</body>
</html>
